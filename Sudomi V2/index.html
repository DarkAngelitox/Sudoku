<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1446">
<title>SUDOMI se mudó</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1b1446;color:#fff8ec;font:17px/1.55 "Segoe UI",system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{max-width:420px}
h1{font:900 2rem/1.1 Impact,"Arial Black",sans-serif;letter-spacing:.02em;margin:0 0 12px;color:#ffcc29;text-shadow:3px 3px 0 #e0262f}
p{margin:0 0 14px;color:#d9d3f3}
b{color:#fff}
a{display:inline-block;margin-top:8px;background:#e0262f;color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px;box-shadow:0 5px 0 #8f1219}
.barra{height:6px;border-radius:9px;background:#2e2470;overflow:hidden;margin:18px 0}
.barra i{display:block;height:100%;width:30%;background:#5ef2c1;animation:va 1.2s ease-in-out infinite alternate}
@keyframes va{to{transform:translateX(233%)}}
@media (prefers-reduced-motion:reduce){.barra i{animation:none;width:100%}}
</style>
</head>
<body>
<main>
  <h1>SUDOMI se mudó</h1>
  <p>Ahora vive en <b>arcade.sudomi-rd.com</b>. Estamos llevando tu progreso a la casa nueva.</p>
  <div class="barra" aria-hidden="true"><i></i></div>
  <p>Cuando llegues, instálala otra vez desde ahí y ya puedes borrar esta.</p>
  <a id="ir" href="https://arcade.sudomi-rd.com/">Ir a la dirección nueva</a>
</main>
<script>
/* SUDOMI — MUDANZA (1 nov 2026). Esta dirección ya no tiene el juego. Empaqueta el progreso de este teléfono
 * (las claves sudomi-… de este sitio) y lo lleva a la dirección nueva detrás de #, que el navegador nunca manda
 * a ningún servidor; allí js/mudanza.js lo guarda y lo borra de la barra. Después de mudarse una vez solo redirige. */
(function(){
  var DESTINO='https://arcade.sudomi-rd.com/',url=DESTINO,d={},n=0;
  try{
    if(!localStorage.getItem('sudomi-mudado')){
      for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sudomi/.test(k)&&!/pool/.test(k)){d[k]=localStorage.getItem(k);n++}}
      if(n){
        var u=new TextEncoder().encode(JSON.stringify({v:1,from:location.host+location.pathname,t:Date.now(),d:d})),s='';
        for(var j=0;j<u.length;j+=32768)s+=String.fromCharCode.apply(null,u.subarray(j,j+32768));
        url=DESTINO+'#mudanza='+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      }
      localStorage.setItem('sudomi-mudado',String(Date.now()));
    }
  }catch(_){}
  document.getElementById('ir').href=url;
  try{caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(_){}
  setTimeout(function(){location.replace(url)},1500);
})();
</script>
</body>
</html>
