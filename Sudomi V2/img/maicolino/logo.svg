  <path d="M76 62c-9 9-15 14-15 21a8 8 0 0 0 13 6c-1 5-3 8-5 10h14c-2-2-4-5-5-10a8 8 0 0 0 13-6c0-7-6-12-15-21z" fill="#1a1408"/>
 </g>
