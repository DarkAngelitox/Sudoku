  <rect x="24" y="110" width="45" height="45"/><path d="M39 110v45M54 110v45M24 125h45M24 140h45"/>
 </g>
 <g font-family="Georgia,serif" font-size="11" font-weight="700" fill="#e9cf85" text-anchor="middle">
  <text x="31.500" y="121.500">4</text><text x="46.500" y="121.500">1</text><text x="31.500" y="136.500">7</text><text x="46.500" y="151.500">5</text><text x="61.500" y="136.500">9</text><text x="31.500" y="151.500">3</text><text x="61.500" y="151.500">6</text>
 </g>
