<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="SUDOMI, colección de juegos clásicos">
 <defs>
  <linearGradient id="au" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3a1"/><stop offset=".45" stop-color="#c9a24a"/><stop offset="1" stop-color="#8a6a22"/></linearGradient>
  <linearGradient id="au2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeeb9"/><stop offset="1" stop-color="#b98f34"/></linearGradient>
  <radialGradient id="navy" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#27324f"/><stop offset=".7" stop-color="#151c30"/><stop offset="1" stop-color="#0b101d"/></radialGradient>
  <radialGradient id="coin" cx=".4" cy=".32" r=".8"><stop offset="0" stop-color="#f3dc92"/><stop offset=".6" stop-color="#c39a40"/><stop offset="1" stop-color="#7d5e1c"/></radialGradient>
  <path id="arc" d="M 40.5 178.5 A 101 101 0 0 0 215.5 178.5"/>
 </defs>
 <!-- parche redondo de cuero con borde dorado y costura -->
 <circle cx="128" cy="128" r="126" fill="url(#au)"/>
 <circle cx="128" cy="128" r="119" fill="url(#navy)"/>
 <circle cx="128" cy="128" r="112" fill="none" stroke="#d8b65c" stroke-width="1.4" stroke-dasharray="5 3.4" opacity=".9"/>
