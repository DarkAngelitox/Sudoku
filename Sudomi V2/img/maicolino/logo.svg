  <path d="M110 110L128 129L146 110" stroke="#c9a24a" stroke-width="1.6"/>
 </g>
 <circle cx="128" cy="88" r="5" fill="#2a1d06"/><circle cx="128" cy="88" r="2" fill="#e9cf85"/>
 <text x="128" y="123" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2a1d06">M</text>
 <!-- nombre -->
 <text x="128" y="194" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="33" font-weight="700" letter-spacing="1.5" fill="url(#au2)" stroke="#5a431a" stroke-width=".7" paint-order="stroke">SUDOMI</text>
 <text font-family="Georgia,'Times New Roman',serif" font-size="8.200" font-weight="700" letter-spacing="1.1" fill="#d8b65c"><textPath href="#arc" startOffset="50%" text-anchor="middle">COLECCIÓN DE JUEGOS CLÁSICOS</textPath></text>
</svg>
