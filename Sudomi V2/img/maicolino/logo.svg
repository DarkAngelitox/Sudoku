  <rect x="198" y="154" width="18" height="18" rx="4" fill="url(#au2)" transform="rotate(14 207 163)"/>
 </g>
 <g fill="#1a1408"><circle cx="181" cy="156" r="1.9"/><circle cx="186" cy="160" r="1.9"/><circle cx="191" cy="164" r="1.9"/><circle cx="203" cy="159" r="1.7"/><circle cx="211" cy="167" r="1.7"/></g>
 <!-- medallón central: escuadra y compás -->
 <circle cx="128" cy="118" r="47" fill="#0b101d" opacity=".55"/>
 <circle cx="128" cy="116" r="45" fill="url(#coin)" stroke="#5a431a" stroke-width="2"/>
 <circle cx="128" cy="116" r="38.500" fill="none" stroke="#6b5117" stroke-width="3.2" stroke-dasharray="6 3.2" opacity=".85"/>
 <circle cx="128" cy="116" r="33" fill="none" stroke="#6b5117" stroke-width="1"/>
 <g fill="none" stroke="#2a1d06" stroke-linecap="round" stroke-linejoin="round">
