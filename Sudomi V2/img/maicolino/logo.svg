  <line x1="194" y1="96" x2="212" y2="96" stroke="#5a431a" stroke-width="1.4"/>
  <g fill="#1a1408"><circle cx="198" cy="81" r="2.2"/><circle cx="208" cy="90" r="2.2"/><circle cx="203" cy="107" r="2.2"/></g>
 </g>
 <!-- sudoku -->
